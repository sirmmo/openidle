<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenIdle</title>
<meta name="description" content="An open-source engine for idle and incremental games, in Rust: rules as data, WebAssembly in the browser, shared worlds on a server.">
<style>
:root {
  --bg: #15130f; --panel: #1f1c17; --panel2: #29251e; --line: #3a342a;
  --text: #f1e9da; --dim: #a99d88; --accent: #f5a623;
  --radius: 10px;
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text); background: var(--bg); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--accent); }
header {
  position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.bar { max-width: 72rem; margin: 0 auto; padding: .7rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.15rem; color: var(--text); text-decoration: none; letter-spacing: .02em; }
.brand span { color: var(--accent); }
nav.pages { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
nav.pages a { color: var(--dim); text-decoration: none; padding: .3rem .65rem; border-radius: 999px; }
nav.pages a:hover { color: var(--text); }
nav.pages a.on { color: var(--text); background: var(--panel2); }
.play {
  background: var(--accent); color: #1b1408; font-weight: 700; text-decoration: none;
  padding: .45rem 1rem; border-radius: 999px; white-space: nowrap;
}
.play:hover { filter: brightness(1.08); }
.gh { color: var(--dim); text-decoration: none; white-space: nowrap; }
.gh:hover { color: var(--text); }
.wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 2.5rem; }
aside { position: sticky; top: 4.5rem; align-self: start; font-size: .9rem; }
aside b { display: block; color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: .75rem; letter-spacing: .08em; margin-bottom: .4rem; }
aside a { display: block; color: var(--dim); text-decoration: none; padding: .2rem 0 .2rem .7rem; border-left: 2px solid var(--line); }
aside a:hover { color: var(--text); border-color: var(--accent); }
article { min-width: 0; }
article h1 { font-size: 2.1rem; line-height: 1.2; margin: .2rem 0 1rem; }
article h2 { font-size: 1.45rem; margin: 2.4rem 0 .7rem; padding-top: .4rem; border-top: 1px solid var(--line); }
article h3 { font-size: 1.1rem; margin: 1.8rem 0 .5rem; }
article p, article li { max-width: 46rem; }
article code { font: .88em/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--panel2); padding: .1em .35em; border-radius: 4px; }
article pre { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; overflow-x: auto; }
article pre code { background: none; padding: 0; font-size: .85rem; }
.table { overflow-x: auto; margin: 1rem 0; }
article table { border-collapse: collapse; font-size: .92rem; }
article th, article td { text-align: left; vertical-align: top; padding: .4rem .8rem .4rem 0; border-bottom: 1px solid var(--line); }
article th { color: var(--dim); font-weight: 600; }
.note { color: var(--dim); }
@media (max-width: 52rem) {
  .wrap { grid-template-columns: 1fr; gap: 1rem; }
  aside { position: static; }
  aside a { display: inline-block; border: 0; padding: .1rem .6rem .1rem 0; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#">Open<span>Idle</span></a>
    <nav class="pages" id="pages"></nav>
    <a class="gh" href="https://github.com/sirmmo/openidle">GitHub</a>
    <a class="play" href="play/?game=sparks">Play the demo</a>
  </div>
</header>
<div class="wrap">
  <aside id="toc"></aside>
  <article id="doc"><p class="note">Loading…</p></article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// The documentation, drawn from the same Markdown files as the repository (web/docs/ links to them). Routes: #, #scripting, #multiplayer, and #<page>/<heading>.
const PAGES = [
  { id: '', file: 'docs/README.md', title: 'Overview' },
  { id: 'scripting', file: 'docs/SCRIPTING.md', title: 'Writing a game' },
  { id: 'multiplayer', file: 'docs/MULTIPLAYER.md', title: 'Shared worlds' },
];
const cache = {};
const $ = (id) => document.getElementById(id);
const slug = (s) => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

// Links between the Markdown files become routes here.
function route(href) {
  const name = href.split('/').pop().split('#')[0].toLowerCase();
  const page = PAGES.find((p) => p.file.toLowerCase().endsWith('/' + name));
  return page ? '#' + page.id : null;
}

async function show() {
  const [id, part] = location.hash.slice(1).split('/');
  const page = PAGES.find((p) => p.id === id) || PAGES[0];
  $('pages').innerHTML = PAGES.map((p) =>
    `<a href="#${p.id}" class="${p === page ? 'on' : ''}">${p.title}</a>`).join('');
  try {
    if (!cache[page.file]) {
      const r = await fetch(page.file);
      if (!r.ok) throw new Error(r.status);
      cache[page.file] = await r.text();
    }
  } catch (e) {
    $('doc').innerHTML = `<p class="note">Could not load ${page.file}. Read it on
      <a href="https://github.com/sirmmo/openidle">GitHub</a>.</p>`;
    return;
  }
  $('doc').innerHTML = marked.parse(cache[page.file]);
  for (const a of $('doc').querySelectorAll('a[href]')) {
    const h = a.getAttribute('href');
    if (/\.md(#|$)/i.test(h) && !/^https?:/.test(h)) a.setAttribute('href', route(h) || ('https://github.com/sirmmo/openidle/blob/main/' + h));
  }
  for (const t of $('doc').querySelectorAll('table')) {
    const box = document.createElement('div');
    box.className = 'table';
    t.replaceWith(box);
    box.appendChild(t);
  }
  const heads = [...$('doc').querySelectorAll('h2')];
  for (const h of heads) h.id = (page.id || 'overview') + '-' + slug(h.textContent);
  $('toc').innerHTML = heads.length ? '<b>On this page</b>' + heads.map((h) =>
    `<a href="#${page.id}/${slug(h.textContent)}">${h.textContent}</a>`).join('') : '';
  document.title = page.id ? `${page.title} · OpenIdle` : 'OpenIdle';
  const target = part && document.getElementById((page.id || 'overview') + '-' + part);
  if (target) target.scrollIntoView();
  else window.scrollTo(0, 0);
}
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
